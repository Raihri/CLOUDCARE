# CloudCare backend configuration.
#
# Only the values marked REQUIRED have to be provided (via .env, loaded by
# ./run-backend.sh, or real environment variables). Everything else has a
# sensible local default and can be overridden with the env var shown.

spring.application.name=${SPRING_APPLICATION_NAME:cloud-care}

# ---- Database (REQUIRED) ---------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# ---- JPA / Hibernate -------------------------------------------------------
# `update` keeps the schema in sync with the entities; there are no migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ---- Web security ------------------------------------------------------------
# Browser origins allowed to call the API, open the WebSocket and submit
# state-changing requests (CSRF origin check). Comma-separated.
cloudcare.allowed-origins=${CLOUDCARE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
# Public URL of the Next.js app, used to build password-reset links.
cloudcare.frontend-url=${CLOUDCARE_FRONTEND_URL:http://localhost:3000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---- Bootstrap admin (REQUIRED) -------------------------------------------
# Created on first start if no admin with this email exists.
ADMIN_EMAIL=${ADMIN_EMAIL}
ADMIN_PASSWORD=${ADMIN_PASSWORD}

# ---- Email via Brevo (optional) -------------------------------------------
# With no API key, sends are skipped and logged; every flow still works.
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@cloudcare.local}
brevo.sender.name=${BREVO_SENDER_NAME:CloudCare}

# ---- File uploads via Supabase Storage (optional) -------------------------
# Leave empty to run without uploads; the storage service fails with a clear
# message only when a file is actually uploaded.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:cloudcare}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---- Prescription reminders -----------------------------------------------
# Hourly by default. Reminder flags make the job idempotent, so it is safe to
# run on startup as well as on this schedule.
cloudcare.prescription-reminder-cron=${PRESCRIPTION_REMINDER_CRON:0 0 * * * *}

# ---- Legacy Thymeleaf views -----------------------------------------------
spring.thymeleaf.cache=false
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
