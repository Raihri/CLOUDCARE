# Application
# Defaulted so a local checkout boots without exporting SPRING_APPLICATION_NAME.
# Without a default this placeholder throws and the context fails to start.
spring.application.name=${SPRING_APPLICATION_NAME:cloud-care}

# ===============================
# PostgreSQL Database Connection
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE}

# ===============================
# Brevo (Email API)
# ===============================
brevo.api_key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

# ===============================
# Static Resources (Uploads etc.)
# ===============================
spring.mvc.static-path-pattern=${SPRING_MVC_STATIC_PATH_PATTERN}
spring.web.resources.static-locations=${SPRING_WEB_RESOURCES_STATIC_LOCATIONS}

# ===============================
# Supabase Storage
# ===============================
# The backend uploads through the Storage REST API with the service-role key.
# Leave these empty to run the app without uploads; the storage service then
# fails with a clear message only when a file is actually uploaded.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:cloudcare}

# ===============================
# Prescription reminders
# ===============================
# Hourly by default. Reminder flags make the job idempotent, so it is safe to
# run on startup as well as on this schedule.
cloudcare.prescription-reminder-cron=${PRESCRIPTION_REMINDER_CRON:0 0 * * * *}

# ===============================
# Admin Credentials
# ===============================
ADMIN_EMAIL=${ADMIN_EMAIL}
ADMIN_PASSWORD=${ADMIN_PASSWORD}
#========================
# multiple file handle
#========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
